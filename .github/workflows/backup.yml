# Резервная копия базы: каждое воскресенье и по кнопке Run workflow.
# Файл копии хранится 90 дней во вкладке Actions → запуск → Artifacts (виден только вам).
# Пары в копии зашифрованы — для их восстановления нужен ключ ENCRYPTION_KEY из вашего менеджера паролей.
name: Резервная копия базы

on:
  schedule:
    - cron: "17 3 * * 0"
  workflow_dispatch:

jobs:
  backup:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node scripts/ensure-d1.mjs
      - name: Выгрузка базы
        run: npx wrangler d1 export secret-santa-db --remote --output "backup-$(date -u +%Y-%m-%d).sql"
      - uses: actions/upload-artifact@v4
        with:
          name: d1-backup
          path: backup-*.sql
          retention-days: 90
