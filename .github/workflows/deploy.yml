# Автовыкладка: после зелёных тестов на ветке main код копируется на ваш сервер
# и бот перезапускается. Нужны секреты репозитория (Settings → Secrets → Actions):
#   SERVER_HOST — IP сервера, SERVER_USER — пользователь (ubuntu), SERVER_SSH_KEY — приватный SSH-ключ.
# Файл .env и база data/ живут только на сервере и не перезаписываются.
name: Выкладка на сервер

on:
  workflow_run:
    workflows: ["Тесты"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      SERVER_HOST: ${{ secrets.SERVER_HOST }}
    steps:
      - name: Сервер настроен?
        if: env.SERVER_HOST == ''
        run: echo "::notice::Секреты сервера ещё не добавлены (DEPLOY.md, этап 4) — выкладка пропущена."
      - uses: actions/checkout@v4
        if: env.SERVER_HOST != ''
      - name: Копируем код на сервер
        if: env.SERVER_HOST != ''
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          source: "santa,requirements.txt,Dockerfile,docker-compose.yml"
          target: "~/secret-santa-bot"
      - name: Перезапускаем бота
        if: env.SERVER_HOST != ''
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          script: |
            cd ~/secret-santa-bot
            test -f .env || { echo "Нет файла .env на сервере — создайте его (см. DEPLOY.md, шаг 4)"; exit 1; }
            docker compose up -d --build
            docker image prune -f
            sleep 5
            docker compose logs --tail=20
