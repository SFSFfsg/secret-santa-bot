# Публикация на Cloudflare: после зелёных тестов на ветке main.
# Нужны секреты репозитория CLOUDFLARE_API_TOKEN и CLOUDFLARE_ACCOUNT_ID (см. DEPLOY.md).
name: Публикация

on:
  workflow_run:
    workflows: ["Тесты"]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Секреты Cloudflare на месте?
        if: env.CLOUDFLARE_API_TOKEN == '' || env.CLOUDFLARE_ACCOUNT_ID == ''
        run: |
          echo "::error::Не заданы секреты CLOUDFLARE_API_TOKEN и/или CLOUDFLARE_ACCOUNT_ID (DEPLOY.md, шаг К1)."
          exit 1
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: База данных D1
        run: node scripts/ensure-d1.mjs
      - name: Обновление структуры базы (миграции)
        run: npx wrangler d1 migrations apply secret-santa-db --remote
      - name: Публикация Worker
        run: npx wrangler deploy
      - name: Адрес приложения
        run: echo "::notice::Приложение опубликовано. Адрес — в строке «https://secret-santa-nf…workers.dev» выше, в шаге «Публикация Worker»."
